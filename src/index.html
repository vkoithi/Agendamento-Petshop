<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Petshop</title>
</head>
<body>
    <div>
        <img src="assets/Logo.svg" alt="Logo">
    </div>

    <main class="main">
        <header>
            <h1>Sua Agenda</h1>
            <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
        </header>

        <label for="date" class="date">
            <img src="assets/icons/Calendar-Minimalistic--Streamline-Solar.svg" alt="">
            <input 
                type="date"
                id="date"
            >
            <img src="assets/icons/Icon.svg" alt="">
        </label>

        <section class="morning">
            <header>
                <img src="assets/icons/Sun-Fog--Streamline-Solar.svg" alt="">
                <strong>Manhã</strong>
                <span>09h-12h</span>
            </header>
            <ul id="period-morning">
            </ul>
        </section>

        <section class="afternoon">
            <header>
                <img src="assets/icons/Cloud-Sun-4--Streamline-Solar.svg" alt="">
                <strong>Tarde</strong>
                <span>13h-18h</span>
            </header>
            <ul id="period-afternoon">
            </ul>
        </section>

        <section class="night">
            <header>
                <img src="assets/icons/Moon-Stars--Streamline-Solar.svg" alt="">
                
                <strong>Noite</strong>

                <span>19h-21h</span>
            </header>

            <ul id="period-night">
                <li>
                    <strong class="schedule-hour">
                        20:00
                    </strong>

                    <span class="schedule-client">
                        <strong>Max</strong> / Camila Santos
                    </span>

                    <span class="schedule-service">
                        Limpeza de Dentes
                    </span>

                    <button type="button" class="remove-button">
                        Remover agendamento
                    </button>
                </li>
            </ul>
        </section>
    </main>

    <button id="button-schedule" type="button">
        Novo Agendamento
    </button>

    <div class="modal-overlay hide">
        <div class="modal hide">
            <button type="button" id="close-modal" aria-label="Fechar modal">
                <img src="assets/icons/Close-Small-Fill--Streamline-Rounded-Fill---Material-Symbols.svg" alt="">
            </button>
        
            <header>
                <h2>Agende um atendimento</h2>
                <p>Preencha os dados do cliente para realizar o agendamento:</p>
            </header>
        
            <form class="form">
                <section id="tutor">
                    <label for="tutor-name">Nome do tutor</label>
                    <div class="input-wrapper">
                        <img src="assets/icons/User--Streamline-Solar.svg" alt="">
                        <input
                            type="text"
                            id="tutor-name"
                            name="tutor-name"
                            placeholder="Helena Souza"
                            required
                        >
                    </div>
                </section>
                <section id="pet">
                    <label for="pet-name">Nome do pet</label>
                    <div class="input-wrapper">
                        <img src="assets/icons/Pet-Paw--Streamline-Core.svg" alt="">
                        <input
                            type="text"
                            id="pet-name"
                            name="pet-name"
                            placeholder="Cheddar"
                            required
                        >
                    </div>
                </section>
                <section id="telephone">
                    <label for="phone-number">Telefone</label>
                    <div class="input-wrapper">
                        <img src="assets/icons/Phone--Streamline-Solar.svg" alt="">
                        <input
                            type="tel"
                            id="phone-number"
                            name="phone-number"
                            placeholder="(00) 0 0000-0000"
                            required
                        >
                    </div>
                </section>
                <section id="description">
                    <label for="service-description">Descrição do serviço</label>
                    <div class="input-wrapper">
                        <textarea
                            name="services"
                            id="service-description"
                            rows="5"
                            cols="20"
                            required
                        ></textarea>
                    </div>
                </section>
                <section id="scheduling">
                    <label for="schedule">Data</label>
                    <div class="input-wrapper">
                        <img src="assets/icons/Calendar-Minimalistic--Streamline-Solar.svg" alt="">
                        <input
                            type="date"
                            name="schedule"
                            id="schedule"
                            required
                        >
                        <img src="assets/icons/Icon.svg" alt="">
                    </div>
                </section>
                <section id="hour">
                    <label for="appointment-time">Hora</label>
                    <div class="input-wrapper">
                        <img src="assets/icons/Clock-Circle--Streamline-Solar.svg" alt="">
                        <input
                            type="time"
                            id="appointment-time"
                            required
                        >
                        <img src="assets/icons/Icon.svg" alt="">
                    </div>
                </section>
        
                <button type="submit">
                    Agendar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
